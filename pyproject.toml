[project]
name = "dynra"
version = "0.1.0"
description = "Live Python runtime for LLM coding agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "ipython>=8.0",
    "mcp>=1.0,<2",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
dynra = "dynra.runtime:run_cli"
dynra-mcp = "dynra.mcp:main"
dynra-client = "dynra.client:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
]
